{% extends "govuk/layout.html" %}
{% load govuk %}
{% block content %}
<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <h1 class="govuk-heading-xl">{{ heading }}</h1>
    <p class="govuk-body">Complete every section before you check your answers.</p>
{% for section in sections %}
    <h2 class="govuk-heading-m">{{ section.heading }}</h2>
    {% govuk "task-list" section.task_list %}
{% endfor %}
  </div>
</div>
{% endblock %}
